<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:'JetBrains Mono';src:local('JetBrains Mono');}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#04070A;font-family:'JetBrains Mono',ui-monospace,monospace;color:#39FF88;display:flex;align-items:center;justify-content:center;height:100vh;}
.card{width:900px;background:linear-gradient(180deg,#081511,#05100c);border:1px solid #1c3327;border-radius:16px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.5);}
.bar{display:flex;align-items:center;gap:9px;padding:14px 20px;border-bottom:1px solid #16261e;background:rgba(57,255,136,.03);}
.dot{width:12px;height:12px;border-radius:6px;}
.title{color:#5f7d6f;font-size:20px;margin-left:12px;}
.body{padding:26px 30px;font-size:26px;line-height:1.55;}
.dim{color:#5f7d6f;}
.cyan{color:#4DE8FF;}
.err{color:#FF5C5C;}
</style>
</head>
<body>
<div class="card">
  <div class="bar"><span class="dot" style="background:#FF5C5C"></span><span class="dot" style="background:#FFCF5C"></span><span class="dot" style="background:#39FF88"></span><span class="title">db.log</span></div>
  <div class="body">
    <div>50 requests <span class="dim">→</span> <span class="cyan">50 connections</span></div>
    <div>opening connection #49 <span class="dim">…</span></div>
    <div>opening connection #50 <span class="dim">…</span></div>
    <div class="err">FATAL: connection limit reached</div>
    <div class="err">✗ slots reserved for superuser</div>
    <div class="dim">▌</div>
  </div>
</div>
</body>
</html>
