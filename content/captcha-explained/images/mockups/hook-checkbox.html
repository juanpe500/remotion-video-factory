<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'JetBrains Mono'; src: local('JetBrains Mono'); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #04070A; font-family: 'JetBrains Mono', ui-monospace, monospace; color: #d7ffe9; display: flex; align-items: center; justify-content: center; height: 100vh; }
  .card { width: 920px; border: 1px solid #1c3327; border-radius: 16px; background: linear-gradient(180deg, #081511, #05100c); overflow: hidden; box-shadow: 0 24px 70px rgba(0,0,0,0.5); }
  .bar { display: flex; align-items: center; gap: 9px; padding: 14px 20px; border-bottom: 1px solid #16261e; background: rgba(57,255,136,0.03); }
  .dot { width: 12px; height: 12px; border-radius: 6px; }
  .title { color: #5f7d6f; font-size: 22px; margin-left: 12px; }
  .body { display: flex; gap: 24px; padding: 26px; }
  .widget { width: 300px; background: #fff; border-radius: 12px; padding: 20px; color: #222; box-shadow: 0 18px 50px rgba(0,0,0,0.45); align-self: flex-start; }
  .wrow { display: flex; align-items: center; gap: 14px; }
  .checkbox { width: 44px; height: 44px; border: 2px solid #9db3a6; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 26px; color: #39FF88; background: #fff; }
  .wlabel { font-size: 20px; line-height: 1.25; }
  .wlogo { margin-top: 16px; padding-top: 14px; border-top: 1px solid #eee; display: flex; align-items: center; gap: 8px; font-size: 14px; color: #999; }
  .wlogo b { color: #337ab7; font-weight: 700; }
  .right { flex: 1; }
  .right h2 { color: #FF5C5C; font-size: 24px; margin-bottom: 14px; letter-spacing: 1px; }
  .log { background: #020609; border: 1px solid #1c3327; border-radius: 10px; padding: 16px 18px; font-size: 20px; line-height: 1.9; }
  .ok { color: #39FF88; }
  .warn { color: #FFCF5C; }
  .dim { color: #5f7d6f; }
  .score { margin-top: 14px; font-size: 26px; color: #4DE8FF; }
  .blink { animation: bl 1.1s steps(1) infinite; }
  @keyframes bl { 50% { opacity: 0; } }
</style>
</head>
<body>
  <div class="card">
    <div class="bar">
      <span class="dot" style="background:#FF5C5C"></span>
      <span class="dot" style="background:#FFCF5C"></span>
      <span class="dot" style="background:#39FF88"></span>
      <span class="title">example.com/login — reCAPTCHA</span>
    </div>
    <div class="body">
      <div class="widget">
        <div class="wrow">
          <div class="checkbox">✓</div>
          <div class="wlabel">I'm not a robot</div>
        </div>
        <div class="wlogo"><b>reCAPTCHA</b> Privacy - Terms</div>
      </div>
      <div class="right">
        <h2>⚠ ALREADY SCORING — BEFORE YOU CLICK</h2>
        <div class="log">
          <div><span class="dim">$</span> score_humanity() — running…</div>
          <div><span class="ok">[OK]</span> cookies + session history</div>
          <div><span class="ok">[OK]</span> browser fingerprint</div>
          <div><span class="ok">[OK]</span> network</div>
          <div><span class="warn">[..]</span> pointer path <span class="dim">wandering…</span></div>
        </div>
        <div class="score">score = 0.87 <span class="blink">▌</span></div>
      </div>
    </div>
  </div>
</body>
</html>
