<!doctype html>
<html lang="en">

<meta charset="utf-8">
<style>
  @font-face { font-family: 'JetBrains Mono'; src: local('JetBrains Mono'); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #04070A; font-family: 'JetBrains Mono', ui-monospace, monospace; color: #d7ffe9; display: flex; align-items: center; justify-content: center; height: 100vh; }
  .card { width: 920px; border: 1px solid #1c3327; border-radius: 16px; background: linear-gradient(180deg, #081511, #05100c); overflow: hidden; box-shadow: 0 24px 70px rgba(0,0,0,0.5); }
  .bar { display: flex; align-items: center; gap: 9px; padding: 14px 20px; border-bottom: 1px solid #16261e; background: rgba(57,255,136,0.03); }
  .dot { width: 12px; height: 12px; border-radius: 6px; }
  .title { color: #5f7d6f; font-size: 22px; margin-left: 12px; }
  .body { padding: 26px; }
  h2 { color: #FF5C5C; font-size: 26px; margin-bottom: 6px; letter-spacing: 1px; }
  .sub { color: #5f7d6f; font-size: 18px; margin-bottom: 18px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .cell { border: 2px solid #1c3327; border-radius: 10px; background: #020609; display: flex; align-items: center; justify-content: center; height: 170px; }
  .cell.sel { border-color: #39FF88; box-shadow: 0 0 14px rgba(57,255,136,0.35); }
  .cell .tag { position: absolute; }
  .btn { margin-top: 18px; display: flex; align-items: center; justify-content: space-between; }
  .verify { background: #39FF88; color: #04070A; font-family: inherit; font-size: 22px; font-weight: 700; padding: 12px 34px; border: none; border-radius: 8px; }
  .skip { color: #5f7d6f; font-size: 18px; }
</style>
</head>
