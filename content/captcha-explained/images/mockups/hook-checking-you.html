<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family:'JetBrains Mono'; src: local('JetBrains Mono'); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:100%; height:100%; }
  body { background:#04070A; font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, monospace; color:#d7ffe9; display:flex; align-items:center; justify-content:center; }
  .card { width:940px; border:1px solid #1c3327; border-radius:16px; background:linear-gradient(180deg,#081511,#05100c); overflow:hidden; box-shadow:0 24px 70px rgba(0,0,0,0.5); }
  .bar { display:flex; align-items:center; gap:9px; padding:12px 16px; border-bottom:1px solid #16261e; background:rgba(57,255,136,0.03); }
  .dot{ width:12px;height:12px;border-radius:6px; }
  .url { color:#5f7d6f; font-size:18px; margin-left:10px; }
  .body { display:flex; gap:22px; padding:22px; }
  .widget { width:300px; background:#fff; border-radius:12px; padding:18px; box-shadow:0 18px 50px rgba(0,0,0,0.5); align-self:flex-start; }
  .wrow { display:flex; align-items:center; gap:12px; }
  .checkbox { width:46px; height:46px; border:2px solid #9db3a6; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:26px; color:#39FF88; background:#fff; }
  .wlabel { font-size:20px; color:#333; line-height:1.25; }
  .wlogo { margin-top:14px; padding-top:12px; border-top:1px solid #eee; display:flex; align-items:center; gap:8px; }
  .wlogo span { font-size:14px; color:#999; }
  .logo-badge { font-weight:700; color:#337ab7; font-size:16px; }
  .right { flex:1; }
  .right h2 { color:#FF5C5C; font-size:24px; margin-bottom:12px; letter-spacing:1px; }
  .log { background:#020609; border:1px solid #1c3327; border-radius:10px; padding:16px 18px; font-size:20px; line-height:1.95; }
  .ok{color:#39FF88} .warn{color:#FFCF5C} .dim{color:#5f7d6f}
  .scoreline { margin-top:14px; font-size:22px; color:#4DE8FF; }
  .blink { animation: bl 1.1s steps(1) infinite; }
  @keyframes bl { 50% { opacity:0 } }
</style>
</head>
<body>
  <div class="card">
    <div class="bar">
      <span class="dot" style="background:#FF5C5C"></span>
      <span class="dot" style="background:#FFCF5C"></span>
      <span class="dot" style="background:#39FF88"></span>
      <span class="url">example.com/login — reCAPTCHA</span>
    </div>
    <div class="body">
      <div class="widget">
        <div class="wrow">
          <div class="checkbox">✓</div>
          <div class="wlabel">I'm not a robot</div>
        </div>
        <div class="wlogo"><span class="logo-badge">reCAPTCHA</span><span>Privacy - Terms</span></div>
      </div>
      <div class="right">
        <h2>⚠ ALREADY SCORING — BEFORE YOU CLICK</h2>
        <div class="log">
          <div><span class="dim">$</span> score_humanity() — running…</div>
          <div><span class="ok">[OK]</span> session cookies <span class="dim">age 3d</span></div>
          <div><span class="ok">[OK]</span> browser fingerprint <span class="dim">84%</span></div>
          <div><span class="ok">[OK]</span> network <span class="dim">stable</span></div>
          <div><span class="warn">[..]</span> pointer path <span class="dim">wandering…</span></div>
        </div>
        <div class="scoreline">score = 0.87 <span class="blink">▌</span></div>
      </div>
    </div>
  </div>
</body>
</html>
