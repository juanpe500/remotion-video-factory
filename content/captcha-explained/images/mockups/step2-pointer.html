<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'JetBrains Mono'; src: local('JetBrains Mono'); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #04070A; font-family: 'JetBrains Mono', ui-monospace, monospace; color: #d7ffe9; display: flex; align-items: center; justify-content: center; height: 100vh; }
  .card { width: 920px; border: 1px solid #1c3327; border-radius: 16px; background: linear-gradient(180deg, #081511, #05100c); overflow: hidden; box-shadow: 0 24px 70px rgba(0,0,0,0.5); }
  .bar { display: flex; align-items: center; gap: 9px; padding: 14px 20px; border-bottom: 1px solid #16261e; background: rgba(57,255,136,0.03); }
  .dot { width: 12px; height: 12px; border-radius: 6px; }
  .title { color: #5f7d6f; font-size: 22px; margin-left: 12px; }
  .body { padding: 26px; }
  h2 { color: #4DE8FF; font-size: 26px; margin-bottom: 6px; letter-spacing: 1px; }
  .sub { color: #5f7d6f; font-size: 18px; margin-bottom: 16px; }
  .plot { background: #020609; border: 1px solid #1c3327; border-radius: 12px; padding: 14px; }
  .legend { display: flex; gap: 28px; margin-top: 16px; font-size: 20px; }
  .lg { display: flex; align-items: center; gap: 10px; }
  .sw { width: 36px; height: 5px; border-radius: 3px; }
  .human { color: #4DE8FF; }
  .bot { color: #FF5C5C; }
</style>
</head>
<body>
  <div class="card">
    <div class="bar">
      <span class="dot" style="background:#FF5C5C"></span>
      <span class="dot" style="background:#FFCF5C"></span>
      <span class="dot" style="background:#39FF88"></span>
      <span class="title">pointer.log — trace comparison</span>
    </div>
    <div class="body">
      <h2>HOW THE HAND MOVES</h2>
      <div class="sub">real hands wander, hesitate, overshoot — scripts don't</div>
      <div class="plot">
        <svg width="860" height="480" viewBox="0 0 860 480" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- grid -->
          <g stroke="#0e2a1e" stroke-width="1">
            <line x1="0" y1="80" x2="860" y2="80"/><line x1="0" y1="160" x2="860" y2="160"/>
            <line x1="0" y1="240" x2="860" y2="240"/><line x1="0" y1="320" x2="860" y2="320"/>
            <line x1="0" y1="400" x2="860" y2="400"/>
            <line x1="172" y1="0" x2="172" y2="480"/><line x1="344" y1="0" x2="344" y2="480"/>
            <line x1="516" y1="0" x2="516" y2="480"/><line x1="688" y1="0" x2="688" y2="480"/>
          </g>
          <!-- target checkbox -->
          <rect x="330" y="150" width="200" height="70" rx="10" fill="#fff"/>
          <rect x="348" y="168" width="34" height="34" rx="6" fill="none" stroke="#9db3a6" stroke-width="2"/>
          <text x="396" y="192" font-family="JetBrains Mono, monospace" font-size="20" fill="#222">I'm not a robot</text>
          <!-- human path: wobbly, wanders, overshoots -->
          <path d="M 60 440 C 120 400, 140 430, 200 380 C 240 350, 230 320, 280 300 C 310 288, 300 260, 330 250 C 350 244, 360 230, 380 235 C 400 240, 380 215, 360 205"
                stroke="#4DE8FF" stroke-width="5" fill="none" stroke-linecap="round"/>
          <circle cx="360" cy="205" r="8" fill="#4DE8FF"/>
          <text x="60" y="462" font-family="JetBrains Mono, monospace" font-size="18" fill="#4DE8FF">HUMAN</text>
          <!-- bot path: straight line, constant speed, exact centre -->
          <line x1="760" y1="440" x2="430" y2="185" stroke="#FF5C5C" stroke-width="5" stroke-linecap="round"/>
          <circle cx="430" cy="185" r="8" fill="#FF5C5C"/>
          <text x="700" y="462" font-family="JetBrains Mono, monospace" font-size="18" fill="#FF5C5C">BOT</text>
        </svg>
      </div>
      <div class="legend">
        <div class="lg"><span class="sw" style="background:#4DE8FF"></span><span class="human">HUMAN — wanders, hesitates, overshoots</span></div>
        <div class="lg"><span class="sw" style="background:#FF5C5C"></span><span class="bot">BOT — straight line, constant speed, exact centre</span></div>
      </div>
    </div>
  </div>
</body>
</html>
