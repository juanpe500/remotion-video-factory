<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --green:#38B886; --cyan:#4ADE4F; --red:#FF5C5C; --dim:#5f7d6f; --kw:#FF7CE5; --fn:#FFCF5C; --str:#FFB86B; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#04070A; font-family:'JetBrains Mono',ui-monospace,monospace; padding:34px; }
  .panel { border:1px solid #1c3327; border-radius:16px; background:linear-gradient(180deg,#081511,#05100c); overflow:hidden; }
  .bar { display:flex; align-items:center; gap:9px; padding:14px 18px; border-bottom:1px solid #16261e; background:rgba(57,255,136,0.03); }
  .dot { width:12px; height:12px; border-radius:6px; }
  .title { color:var(--dim); font-size:20px; margin-left:10px; }
  .code { padding:24px 26px; font-size:24px; line-height:1.5; }
  .cmt { color:var(--dim); }
  .kw { color:var(--kw); }
  .fn { color:var(--fn); }
  .str { color:var(--str); }
  .bad { color:var(--red); }
  .good { color:var(--green); }
  .tag { display:inline-block; font-size:18px; font-weight:700; padding:2px 10px; border-radius:6px; margin-left:8px; }
  .tag.slow { background:rgba(255,92,92,0.15); color:var(--red); }
  .tag.fast { background:rgba(57,255,136,0.15); color:var(--green); }
</style>
</head>
<body>
  <div class="panel">
    <div class="bar"><span class="dot" style="background:var(--red)"></span><span class="dot" style="background:#FFCF5C"></span><span class="dot" style="background:var(--green)"></span><span class="title">index.sql</span></div>
    <div class="code">
      <div><span class="cmt">-- before: full scan</span></div>
      <div><span class="kw">SELECT</span> * <span class="kw">FROM</span> users <span class="kw">WHERE</span> email=<span class="str">'x'</span>; <span class="tag slow">30s @ 100k rows</span></div>
      <div style="height:14px"></div>
      <div><span class="cmt">-- after: proper index</span></div>
      <div><span class="kw">CREATE INDEX</span> idx_users_email <span class="kw">ON</span> users(email);</div>
      <div><span class="kw">SELECT</span> email <span class="kw">FROM</span> users <span class="kw">WHERE</span> email=<span class="str">'x'</span>; <span class="tag fast">2ms</span></div>
    </div>
  </div>
</body>
</html>
