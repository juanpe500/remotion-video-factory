name: Cloudflare smoke test

# One-off probe: from a GitHub runner (datacenter IP), hit the savagescroll API
# through Cloudflare and report which service issued the challenge (cf-mitigated,
# cf-ray). Read-only GET, no upload.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      KEY: ${{ secrets.SAVAGESCROLL_API_KEY }}
    steps:
      - name: Probe /api/v1/pages through Cloudflare
        run: |
          echo "Runner public IP: $(curl -s https://api.ipify.org)"
          echo "=== GET https://app.savagescroll.com/api/v1/pages ==="
          code=$(curl -s -o body.txt -D headers.txt -w "%{http_code}" \
            -H "Authorization: Bearer $KEY" \
            -H "Accept: application/json" \
            https://app.savagescroll.com/api/v1/pages)
          echo "HTTP status: $code"
          echo "=== response headers (cf-* and friends) ==="
          grep -iE '^(cf-|server:|x-|content-type)' headers.txt || cat headers.txt
          echo "=== first 300 bytes of body ==="
          head -c 300 body.txt; echo
          echo "==========================================="
          if grep -qi "just a moment\|challenge-platform\|cf-chl" body.txt headers.txt; then
            echo "RESULT: CHALLENGED (see cf-mitigated header above for the service)"
            exit 1
          fi
          echo "RESULT: PASSED — origin responded HTTP $code (no challenge)"
